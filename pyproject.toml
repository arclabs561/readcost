[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readcost"
dynamic = ["version"]
description = "Flag prose constructions that slow readers down"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["readability", "prose", "linter", "writing", "documentation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "spacy>=3.8,<3.9",
    "markdown-it-py>=3,<5",
    "mdit-py-plugins>=0.4,<1",
    "numpy>=1.24",  # readtime imports it; spaCy brings it in too
]

[project.optional-dependencies]
test = ["pytest>=8"]
lsp = ["pygls>=2.1,<3"]  # pygls pins the lsprotocol it needs

[dependency-groups]
# `uv sync` installs dev by default; `uv run --group eval scripts/NAME.py` runs
# the evaluation scripts that have no inline metadata against this checkout.
dev = ["pytest>=8", "pygls>=2.1,<3"]
eval = ["scipy>=1.11", "pyarrow>=15", "nltk>=3.8"]

[project.urls]
Homepage = "https://github.com/arclabs561/readcost"
Issues = "https://github.com/arclabs561/readcost/issues"
Changelog = "https://github.com/arclabs561/readcost/blob/main/CHANGELOG.md"

[project.scripts]
readcost = "readcost.cli:main"

[tool.setuptools.dynamic]
version = {attr = "readcost.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readcost = ["data/*.json", "data/profiles/*.json", "data/*.json.gz", "data/*.txt.gz", "data/WORDNET_LICENSE", "data/FINEWEB_NOTICE", "data/READING_TIME_NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
