[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readcost"
version = "0.1.0"
description = "Find prose constructions that slow readers down: stacked nouns, long dependencies, and others from arXiv 2610.29162"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["spacy>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
readcost = "readcost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readcost = ["data/*.json", "data/*.json.gz", "data/WORDNET_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
