[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readcost"
version = "0.1.0"
description = "Flag prose constructions that slow readers down"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["spacy>=3.7,<4", "markdown-it-py>=3,<5", "mdit-py-plugins>=0.4,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
readcost = "readcost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readcost = ["data/*.json", "data/*.json.gz", "data/*.txt.gz", "data/WORDNET_LICENSE", "data/FINEWEB_NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
