name: readcost
description: Flag prose constructions that slow readers down, as GitHub annotations.
inputs:
  paths:
    description: Files or directories to check.
    default: "."
  fail-on:
    description: never, advise, or block.
    default: block
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - shell: bash
      run: |
        python -m pip install --quiet "${{ github.action_path }}"
        readcost setup
    # Inputs go through env, never into the script text, so a path cannot
    # inject shell code. Paths are separated by whitespace or newlines.
    - shell: bash
      env:
        READCOST_PATHS: ${{ inputs.paths }}
        READCOST_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        read -r -d '' -a paths <<< "$READCOST_PATHS" || true
        readcost check "${paths[@]}" --output github --fail-on "$READCOST_FAIL_ON"
