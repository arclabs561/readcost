name: readcost
description: Flag prose constructions that slow readers down, as GitHub annotations.
inputs:
  paths:
    description: Files or directories to check.
    default: "."
  fail-on:
    description: never, advise, or block.
    default: block
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: |
        python -m pip install --quiet "${{ github.action_path }}"
        readcost setup
    - shell: bash
      run: readcost check ${{ inputs.paths }} --output github --fail-on ${{ inputs.fail-on }}
