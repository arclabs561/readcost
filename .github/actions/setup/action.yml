name: setup
description: >-
  Python, readcost installed from this checkout, and the spaCy model, with
  pip downloads and the model kept in the Actions cache. Shared by the
  workflows in this repository; run actions/checkout first.
inputs:
  python-version:
    description: Python version to install.
    default: "3.12"
  extras:
    description: Extras to install with readcost, as in pip's brackets.
    default: "test,lsp"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    # readcost setup unpacks the model into ~/.cache/readcost; modelstore.py
    # names the model version, so a new version makes a new cache entry.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/readcost
        key: readcost-model-${{ hashFiles('src/readcost/modelstore.py') }}
    - shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        python -m pip install --quiet -e ".[$EXTRAS]"
        readcost setup
