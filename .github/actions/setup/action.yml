name: setup
description: >-
  uv, Python, readcost installed from this checkout as uv.lock pins it, and
  the spaCy model, with uv's download cache and the model kept in the Actions
  cache. Shared by the workflows in this repository; run actions/checkout
  first. Later steps run tools with `uv run`.
inputs:
  python-version:
    description: Python version for the project environment.
    default: "3.12"
  sync-args:
    description: >-
      More arguments for `uv sync`. The default installs the dev group
      (pytest, pytest-xdist, pygls); `--no-dev` installs readcost alone.
    default: ""
runs:
  using: composite
  steps:
    # The cache key holds the Python version and the hash of uv.lock, so a
    # changed lock file starts a new entry.
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock
    # readcost setup unpacks the model into ~/.cache/readcost; modelstore.py
    # names the model version, so a new version makes a new cache entry.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/readcost
        key: readcost-model-${{ hashFiles('src/readcost/modelstore.py') }}
    # --locked fails when uv.lock does not match pyproject.toml. After the
    # sync, UV_NO_SYNC stops each later `uv run` from changing the environment.
    - shell: bash
      env:
        SYNC_ARGS: ${{ inputs.sync-args }}
      run: |
        read -r -a sync_args <<< "$SYNC_ARGS"
        uv sync --locked "${sync_args[@]}"
        echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
        uv run --no-sync readcost setup
