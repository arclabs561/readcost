# Managed by repository-settings/app
# https://github.com/repository-settings/app

repository:
  description: "Flag prose constructions that slow readers down"
  private: false
  has_issues: true
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true

  topics:
    - readability
    - linter
    - writing
    - python

# The false-positive issue form applies this label.
labels:
  - name: false positive
    color: "d4c5f9"
    description: readcost flagged a sentence that is fine as written
