name: prose

# readcost on this repository's own pull requests: the title, the description
# and every commit message, plus a check for AI attribution. "edited" reruns
# it when the title or description changes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # the commit range and the diff need history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet -e .
          readcost setup
      # The SHAs go through env, and the title and description are read from
      # the event file, so no text from the pull request reaches the shell.
      - name: Commit messages, pull request text, attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_prose.py --base "$BASE" --head "$HEAD_SHA"
      # The repository's own action, as a user would run it: annotations on
      # the prose files that the pull request changes. The CI workflow gates
      # those files; this step only shows where the findings are.
      - name: readcost action on changed files
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          paths: README.md docs CHANGELOG.md
          fail-on: never
