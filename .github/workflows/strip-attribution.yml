name: strip-attribution

# Owner-triggered cleanup of the owner's PR descriptions and reviews.
# The manual sweep applies the same author check to each item.
on:
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: strip-attribution-${{ github.repository }}
  cancel-in-progress: false

jobs:
  strip:
    if: github.event.sender.id == github.event.repository.owner.id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Strip attribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/strip_attribution.py
