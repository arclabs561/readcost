name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --quiet -e '.[test,lsp]'
          python -m pip install --quiet "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
      - name: Test
        run: python -m pytest -q
      # readcost checks its own repo: every file readcost.toml selects
      # (docs, docstrings, YAML and TOML comments) must not block, and the
      # user-facing docs must stay below "advise".
      - name: Check own repo
        run: readcost check . --fail-on block
      - name: Check own docs
        run: readcost check README.md docs --fail-on advise
