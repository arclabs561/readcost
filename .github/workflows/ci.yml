name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python -m pytest -q
      # readcost checks its own repo: every file readcost.toml selects
      # (docs, docstrings, YAML and TOML comments) must not block, and the
      # user-facing docs must stay below "advise".
      - name: Check own repo
        run: readcost check . --fail-on block
      - name: Check own docs
        run: readcost check README.md docs --fail-on advise
