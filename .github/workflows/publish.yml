name: publish

# Pushing a tag vX.Y.Z publishes that commit to PyPI through trusted
# publishing (no token in the repo). The tag must match readcost.__version__,
# and CI must already have passed on the tagged commit: a PyPI version can be
# yanked but never replaced.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh run list -R "$REPO" --workflow ci.yml --commit "$SHA" --status completed \
            --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$conclusion" != success ]; then
            echo "::error::CI on $SHA is '$conclusion'; push the tag after CI passes"
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/readcost/__init__.py)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match __version__ $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build==1.2.2.post1 twine==6.1.0
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke test the wheel
        env:
          READCOST_NO_DOWNLOAD: "1"
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/readcost --version
          /tmp/smoke/bin/readcost explain stacked-nouns
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
